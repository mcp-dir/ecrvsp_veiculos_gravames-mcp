# Smithery configuration for ECRVSP Veículos: Gravames
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_ecrvsp_veiculos_gravames

name: ecrvsp_veiculos_gravames-mcp
displayName: "ECRVSP Veículos: Gravames"
description: >
  ECRVSP Veículos: Gravames, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/ecrvsp_veiculos_gravames-mcp
repository: https://github.com/mcp-dir/ecrvsp_veiculos_gravames-mcp

tags:
  - ecrvsp_veiculos_gravames
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_ecrvsp_veiculos_gravames

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_ecrvsp_veiculos_gravames/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
